# /etc/nginx/sites-available/fhsms   ->  ln -s to sites-enabled, then: sudo nginx -t && sudo systemctl reload nginx
# For HTTPS run afterwards:  sudo certbot --nginx -d agrilink.example.com
server {
    listen 80;
    server_name agrilink.example.com;          # <-- your domain (or _ for IP-only)

    root /var/www/fhsms;                       # <-- contents of release/web
    index index.html;
    client_max_body_size 10m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # API + health -> the .NET app on localhost
    location /api/ {
        proxy_pass http://127.0.0.1:5080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }
    location = /health {
        proxy_pass http://127.0.0.1:5080/health;
    }

    # React app with client-side routing fallback
    location / {
        try_files $uri $uri/ /index.html;
    }
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
    location ~* ^/(index\.html|sw\.js|registerSW\.js|config\.js|manifest\.webmanifest)$ {
        add_header Cache-Control "no-cache";
    }
}
