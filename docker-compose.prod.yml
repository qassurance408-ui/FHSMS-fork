# Production stack - runs on ANY Linux server with Docker (Alet Cloud VPS,
# other VPS providers, an on-premise server, ...).
#
#   cp .env.example .env      # then edit .env   (or just run deploy/setup.sh)
#   docker compose -f docker-compose.prod.yml up -d --build
#
# Services
#   web       Caddy: serves the website, forwards /api to the API, HTTPS (auto)
#   api       ASP.NET Core backend
#   postgres  PostgreSQL database (data kept in the fhsms_pgdata volume)
#   bot       Telegram bot (only started when COMPOSE_PROFILES=telegram)
#
# Only `web` is reachable from outside (ports 80/443). The database and API
# stay on the private Docker network.
#
# Already have a managed PostgreSQL (e.g. from your cloud provider)? Set
# DATABASE_URL in .env (leave POSTGRES_PASSWORD filled in - it is simply
# unused) and start only the web and api containers:
#   docker compose -f docker-compose.prod.yml up -d --build --no-deps web api
name: fhsms

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-fhsms}
      POSTGRES_USER: ${POSTGRES_USER:-fhsms_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - fhsms_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      # We sit behind the web (Caddy) container - trust its X-Forwarded-* headers.
      ASPNETCORE_FORWARDEDHEADERS_ENABLED: "true"

      # Database. If DATABASE_URL is set in .env it wins (managed Postgres).
      ConnectionStrings__DefaultConnection: Host=postgres;Port=5432;Database=${POSTGRES_DB:-fhsms};Username=${POSTGRES_USER:-fhsms_user};Password=${POSTGRES_PASSWORD}
      DATABASE_URL: ${DATABASE_URL:-}

      Jwt__Secret: ${JWT_SECRET:?Set JWT_SECRET in .env (32+ random characters)}
      Jwt__Issuer: FHSMS.API
      Jwt__Audience: FHSMS.Clients
      Jwt__ExpiryMinutes: "480"

      # Site + API share one public address, so CORS is effectively same-origin.
      ALLOWED_ORIGINS: ${PUBLIC_URL:?Set PUBLIC_URL in .env, e.g. https://agrilink.example.com}
      PaymentProviders__ApiPublicBaseUrl: ${PUBLIC_URL}
      PaymentProviders__FrontendPublicBaseUrl: ${PUBLIC_URL}

      # First-run admin login (used once, when the Users table is empty).
      SEED_ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@fhsms.local}
      SEED_ADMIN_PASSWORD: ${ADMIN_PASSWORD:-ChangeMe123!}

      # Optional: payment providers / email / SMS (leave blank until you have them).
      PaymentProviders__BankTransfer__Secret: ${PAYMENT_BANKTRANSFER_SECRET:-}
      PaymentProviders__Chapa__Secret: ${PAYMENT_CHAPA_SECRET:-}
      PaymentProviders__CbeBirr__Secret: ${PAYMENT_CBEBIRR_SECRET:-}
      PaymentProviders__Telebirr__FabricAppId: ${TELEBIRR_FABRIC_APP_ID:-}
      PaymentProviders__Telebirr__AppSecret: ${TELEBIRR_APP_SECRET:-}
      PaymentProviders__Telebirr__MerchantAppId: ${TELEBIRR_MERCHANT_APP_ID:-}
      PaymentProviders__Telebirr__MerchantCode: ${TELEBIRR_MERCHANT_CODE:-}
      PaymentProviders__Telebirr__MerchantPrivateKeyPem: ${TELEBIRR_MERCHANT_PRIVATE_KEY_PEM:-}
      PaymentProviders__Telebirr__TelebirrPublicKeyPem: ${TELEBIRR_PUBLIC_KEY_PEM:-}
      PaymentProviders__Telebirr__ApiBaseUrl: ${TELEBIRR_API_BASE_URL:-}
      PaymentProviders__Telebirr__WebCheckoutBaseUrl: ${TELEBIRR_WEB_CHECKOUT_BASE_URL:-}
    healthcheck:
      # The .NET runtime image has bash but no curl/wget, so probe via /dev/tcp.
      test:
        - CMD
        - bash
        - -c
        - "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /health HTTP/1.0\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && head -n1 <&3 | grep -q ' 200 '"
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 40s

  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # Leave empty (default) so the site calls "/api" on its own domain.
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      # ":80" = plain HTTP (fine for an IP address or testing).
      # "agrilink.example.com" = automatic free HTTPS certificate.
      SITE_ADDRESS: ${SITE_ADDRESS:-:80}
      API_UPSTREAM: api:8080
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - caddy_data:/data        # keeps your HTTPS certificates across restarts
      - caddy_config:/config

  bot:
    profiles: ["telegram"]
    build:
      context: .
      dockerfile: telegram-bot/Dockerfile
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      Telegram__BotToken: ${TELEGRAM_BOT_TOKEN:-}
      Fhsms__ApiBaseUrl: http://api:8080/api
      Fhsms__ServiceAccountEmail: ${ADMIN_EMAIL:-admin@fhsms.local}
      Fhsms__ServiceAccountPassword: ${ADMIN_PASSWORD:-ChangeMe123!}

volumes:
  fhsms_pgdata:
  caddy_data:
  caddy_config:
